# ============================================================
# ARQUIVO: pytest.ini
# O QUE FAZ: diz ao pytest onde procurar os módulos do projeto.
# Sem isso, o pytest não acha a pasta "src".
# ============================================================

[pytest]
# "pythonpath" adiciona a pasta src ao caminho de importação
# Assim "from data_structures..." funciona de qualquer lugar
pythonpath = src

# Onde estão os testes
testpaths = tests